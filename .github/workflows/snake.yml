name: Generate Snake + Stats
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Utada47
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Push snake ke branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate stats & top-langs via API
        run: |
          mkdir -p profile
          curl -s \
            "https://github-readme-stats-eight-theta.vercel.app/api?username=Utada47&show_icons=true&theme=chartreuse-dark&hide_border=true&bg_color=0D1117&title_color=00ff41&icon_color=00ff41&text_color=c9d1d9" \
            -o profile/stats.svg
          curl -s \
            "https://github-readme-stats-eight-theta.vercel.app/api/top-langs/?username=Utada47&theme=chartreuse-dark&hide_border=true&bg_color=0D1117&title_color=00ff41&text_color=c9d1d9&layout=compact&langs_count=6" \
            -o profile/top-langs.svg
          echo "=== stats ===" && head -3 profile/stats.svg
          echo "=== top-langs ===" && head -3 profile/top-langs.svg
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
      - name: Commit stats ke main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git commit -m "Update stats cards [skip ci]" || exit 0
          git push
